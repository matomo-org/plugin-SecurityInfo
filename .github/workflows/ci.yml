name: Plugins CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - '**.x-dev'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: matomo-org/plugin-ci-workflows/.github/workflows/plugin-ci.yml@main
    with:
      plugin-name: SecurityInfo
      verify-hook: true
      phpcs-php-version: matomo5_max_php
      phpstan-php-version: matomo5_min_php
      compatibility-php-version: matomo5_min_php
